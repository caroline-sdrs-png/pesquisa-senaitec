<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <h1>Pesquisa senaitec</h1>
    </header>
    <section>
        <form action="index.html" method="get">
            <fieldset>
                <legend>
                    Dados Pessoais
                </legend>
                
                <label for="userName"> Nome:</label>
                <input type="text" name="userName" id="userName">
                required

                <br>
                <label for="userAge">Idade</label>
                <input type="number" name="userAge" id="userAge">
                required min="12" max="100"

                 <br>
                <label for="userBirthDate">Data de Nascimento</label>
                <input type="date" name="userAge" id="userBirthDate">

                <br>
                <label for="userEmail">Email:</label>
                <input type="Email" name="userEmail" id="userEmail">
                required

                <br>
                <label for="userPhone">Telefone:</label>
                <input type="Tel" name="userPhone" id="userPhone">
                pattern"{0-9} {11}" placeholder="21987654321"

                <br>
                <label for="userImage">Upload da foto:</label>
                <input type="File" name="userImage" id="userImage">

            </fieldset>
            
            
            <button type="submit" >enviar</button>
            
        </form>
    </section>
</body>
</html>
